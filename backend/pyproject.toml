[project]
name = "vasculorisk-backend"
version = "0.1.0"
description = "VasculoRisk training pipeline and API"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "pandas",
  "numpy",
  "scikit-learn",
  "imbalanced-learn",
  "lightgbm",
  "joblib",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
